name: Update Music

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: update-music-readme
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch public webhook data
        env:
          WEBHOOK_TOKEN: ${{ secrets.WEBHOOK_TOKEN }}
        run: |
          set -e
          APP_BASE_URL="https://live-listening-diary.vercel.app"

          curl -sS -f \
            "${APP_BASE_URL}/api/public/${WEBHOOK_TOKEN}?event=scrobble&limit=3" \
            > listening.json

      - name: Build music markdown and update README block
        run: |
          python - << 'PY'
          import json
          from datetime import datetime, timezone
          from html import escape

          with open("listening.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          item = (data or {}).get("now_playing") or {}
          items = (data or {}).get("recent") or []

          def time_label(row):
            value = row.get("received_at_human") or row.get("time_ago") or row.get("played_at_human") or row.get("timestamp_human")
            return value or ""

          def artwork_url(row):
            return row.get("artwork_url") or row.get("image") or "https://via.placeholder.com/300x300?text=No+Cover"

          recent_rows = items[:3]
          if item:
            current_artist = item.get("artist", "Unknown")
            current_track = item.get("track", "Untitled")
            current_album = item.get("album", "")
            current_time = time_label(item)
          else:
            current_artist = "No active track"
            current_track = ""
            current_album = ""
            current_time = ""

          card_html = []
          card_html.append('<h3 align="left">Recently Played</h3>')
          card_html.append('<table width="100%" cellspacing="0" cellpadding="0" style="border-collapse:separate;border-spacing:14px 0;">')
          card_html.append('<tr>')

          for row in recent_rows:
            artist = escape(str(row.get("artist", "Unknown")))
            track = escape(str(row.get("track", "Untitled")))
            album = escape(str(row.get("album", "")))
            time_text = escape(str(time_label(row)))
            image = escape(str(artwork_url(row)))
            album_html = f'<div style="font-size:12px;color:#8f8f9f;margin-top:6px;">{album}</div>' if album else ""
            card_html.append(
              '<td valign="top" width="33.333%" style="padding:0;">'
              '<div style="background:#17171f;border:1px solid #2f2a52;border-radius:16px;padding:14px;min-height:136px;">'
              '<table width="100%" cellspacing="0" cellpadding="0">'
              '<tr>'
              f'<td width="118" style="padding-right:14px;vertical-align:middle;"><img src="{image}" alt="{track}" width="118" height="118" style="display:block;border-radius:12px;object-fit:cover;" /></td>'
              '<td style="vertical-align:middle;">'
              f'<div style="font-size:18px;line-height:1.2;font-weight:700;color:#f3f3f7;margin-bottom:6px;">{track}</div>'
              f'<div style="font-size:14px;line-height:1.35;color:#b6b6c7;margin-bottom:10px;">{artist}</div>'
              f'<div style="font-size:13px;color:#9d6bff;font-weight:600;">{time_text}</div>'
              f'{album_html}'
              '</td>'
              '</tr>'
              '</table>'
              '</div>'
              '</td>'
            )

          card_html.append('</tr>')
          card_html.append('</table>')
          card_html.append('')
          card_html.append('<div style="font-size:12px;color:#8f8f9f;margin-top:8px;">')
          if current_track:
            current_line = f'Now playing: <strong>{escape(current_track)}</strong> by {escape(current_artist)}'
            if current_album:
              current_line += f' • {current_album}'
            if current_time:
              current_line += f' • {escape(current_time)}'
            card_html.append(current_line)
          else:
            card_html.append(f'Now playing: {escape(current_artist)}')
          card_html.append('</div>')
          last_updated = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC")
          card_html.append(f'<div style="font-size:12px;color:#8f8f9f;margin-top:6px;">Last updated: {last_updated}</div>')

          music_block = "\n".join(card_html) + "\n"
          with open("MUSIC.md", "w", encoding="utf-8") as f:
              f.write(music_block)

          with open("README.md", "r", encoding="utf-8") as f:
              readme = f.read()

          start = "<!-- MUSIC:START -->"
          end = "<!-- MUSIC:END -->"

          if start not in readme or end not in readme:
              raise SystemExit("README markers not found: MUSIC:START / MUSIC:END")

          before, rest = readme.split(start, 1)
          _, after = rest.split(end, 1)
          updated = before + start + "\n\n" + music_block + "\n" + end + after

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(updated)
          PY

      - name: Commit update
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"

          git add README.md MUSIC.md listening.json
          git diff --cached --quiet || git commit -m "chore: update listening data"
          git push
