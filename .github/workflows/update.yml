name: Update Music

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: update-music-readme
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch public webhook data
        env:
          WEBHOOK_TOKEN: ${{ secrets.WEBHOOK_TOKEN }}
        run: |
          set -e
          APP_BASE_URL="https://live-listening-diary.vercel.app"

          curl -sS -f \
            "${APP_BASE_URL}/api/public/${WEBHOOK_TOKEN}?event=scrobble&limit=3" \
            > listening.json

      - name: Build music markdown and update README block
        run: |
          python - << 'PY'
          import json
          from datetime import datetime, timezone

          with open("listening.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          item = (data or {}).get("now_playing") or {}
          items = (data or {}).get("recent") or []

          def time_label(row):
              value = row.get("received_at_human") or row.get("time_ago") or row.get("played_at_human") or row.get("timestamp_human")
              return value or ""

          def artwork_url(row):
              return row.get("artwork_url") or row.get("image") or "https://via.placeholder.com/300x300?text=No+Cover"

          recent_rows = (items or [])[:3]

          lines = []
          lines.append("# 🎧 Live Listening Diary")
          lines.append("")
          lines.append("")
          lines.append("---")
          lines.append("")
          lines.append('<p align="center">')
          lines.append('  <sub>Real-time music tracking dashboard • Built with FastAPI + PostgreSQL</sub>')
          lines.append('</p>')
          lines.append("")
          lines.append("---")
          lines.append("")
          lines.append("## 🎵 Recently Played")
          lines.append("")
          lines.append("<table>")
          lines.append("<tr>")

          for i in range(3):
              row = recent_rows[i] if i < len(recent_rows) else {}
              artist = str(row.get("artist", "No artist"))
              track = str(row.get("track", "No track"))
              time_text = str(time_label(row)) or "-"
              image = str(artwork_url(row))

              lines.append("")
              lines.append("<td align=\"center\">")
              lines.append("")
              lines.append(f'<img src="{image}" width="120" height="120"/>')
              lines.append("")
              lines.append("<br/>")
              lines.append("")
              lines.append(f"**🎵 {track}**")
              lines.append(artist)
              lines.append("")
              lines.append(f"<sub>🟣 {time_text}</sub>")
              lines.append("")
              lines.append("</td>")

          lines.append("")
          lines.append("</tr>")
          lines.append("</table>")
          lines.append("")
          lines.append("---")
          lines.append("")
          last_updated = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC")
          lines.append('<p align="center">')
          lines.append(f'  <sub>⏱ Last updated: {last_updated}</sub>')
          lines.append('</p>')

          music_block = "\n".join(lines) + "\n"
          with open("MUSIC.md", "w", encoding="utf-8") as f:
              f.write(music_block)

          with open("README.md", "r", encoding="utf-8") as f:
              readme = f.read()

          start = "<!-- MUSIC:START -->"
          end = "<!-- MUSIC:END -->"

          if start not in readme or end not in readme:
              raise SystemExit("README markers not found: MUSIC:START / MUSIC:END")

          before, rest = readme.split(start, 1)
          _, after = rest.split(end, 1)
          updated = before + start + "\n\n" + music_block + "\n" + end + after

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(updated)
          PY

      - name: Commit update
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"

          git add README.md MUSIC.md listening.json
          git diff --cached --quiet || git commit -m "chore: update listening data"
          git push
