name: Update Music

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: update-music-readme
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch public webhook data
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          WEBHOOK_TOKEN: ${{ secrets.WEBHOOK_TOKEN }}
        run: |
          set -e

          curl -sS -f \
            "${APP_BASE_URL}/api/public/${WEBHOOK_TOKEN}?event=scrobble&limit=3" \
            > listening.json

      - name: Build music markdown and update README block
        run: |
          python - << 'PY'
          import json
          from datetime import datetime, timezone

          with open("listening.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          item = (data or {}).get("now_playing") or {}
          items = (data or {}).get("recent") or []

          lines = []
          lines.append("## Now Playing")
          if item:
              artist = item.get('artist', 'Unknown')
              track = item.get('track', 'Untitled')
              album = item.get('album', '')
              current = f"- **{track}** by {artist}"
              if album:
                current += f" • _{album}_"
              lines.append(current)
          else:
              lines.append("- No active track")

          lines.append("")
          lines.append("## Recent 3 Tracks")
          if items:
              for index, row in enumerate(items[:3], start=1):
                  artist = row.get('artist', 'Unknown')
                  track = row.get('track', 'Untitled')
                  album = row.get('album', '')
                  line = f"{index}. **{track}** by {artist}"
                  if album:
                      line += f" • _{album}_"
                  lines.append(line)
          else:
              lines.append("- No recent scrobbles")

          lines.append("")
          lines.append(f"_Last updated: {datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M UTC')}_")

          music_block = "\n".join(lines) + "\n"
          with open("MUSIC.md", "w", encoding="utf-8") as f:
              f.write(music_block)

          with open("README.md", "r", encoding="utf-8") as f:
              readme = f.read()

          start = "<!-- MUSIC:START -->"
          end = "<!-- MUSIC:END -->"

          if start not in readme or end not in readme:
              raise SystemExit("README markers not found: MUSIC:START / MUSIC:END")

          before, rest = readme.split(start, 1)
          _, after = rest.split(end, 1)
          updated = before + start + "\n\n" + music_block + "\n" + end + after

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(updated)
          PY

      - name: Commit update
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"

          git add README.md MUSIC.md listening.json
          git diff --cached --quiet || git commit -m "chore: update listening data"
          git push
