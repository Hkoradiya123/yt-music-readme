name: Update Music

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: update-music-readme
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch public webhook data
        env:
          WEBHOOK_TOKEN: ${{ secrets.WEBHOOK_TOKEN }}
        run: |
          set -e
          APP_BASE_URL="https://live-listening-diary.vercel.app"

          curl -sS -f \
            "${APP_BASE_URL}/api/public/${WEBHOOK_TOKEN}?event=scrobble&limit=3" \
            > listening.json

      - name: Build music markdown and update README block
        run: |
          python - << 'PY'
          import json
          from datetime import datetime, timezone
          from html import escape

          with open("listening.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          item = (data or {}).get("now_playing") or {}
          items = (data or {}).get("recent") or []

          def time_label(row):
              value = row.get("received_at_human") or row.get("time_ago") or row.get("played_at_human") or row.get("timestamp_human")
              return value or ""

          def artwork_url(row):
              return row.get("artwork_url") or row.get("image") or "https://via.placeholder.com/300x300?text=No+Cover"

          def clean_album(value):
              text = str(value or "").strip()
              if text.lower() in {"", "false", "none", "null"}:
                  return ""
              return text

          recent_rows = (items or [])[:3]

          if item:
              current_artist = escape(str(item.get("artist", "Unknown")))
              current_track = escape(str(item.get("track", "Untitled")))
              current_time = escape(str(time_label(item)))
          else:
              current_artist = "No active track"
              current_track = ""
              current_time = ""

          card_html = []
          card_html.append('<h3 align="left" style="margin:0 0 12px 2px;color:#e8ecff;font-size:24px;line-height:1.2;letter-spacing:0.2px;">🎵 Recently Played 🎵</h3>')
          card_html.append('<table width="100%" cellspacing="0" cellpadding="6" style="border-collapse:collapse;table-layout:fixed;">')
          card_html.append('<tr>')

          for i in range(3):
              row = recent_rows[i] if i < len(recent_rows) else {}
              artist = escape(str(row.get("artist", "No artist")))
              track = escape(str(row.get("track", "No track")))
              album = escape(clean_album(row.get("album", "")))
              if album and album.lower() == track.lower():
                album = ""
              time_text = escape(str(time_label(row))) or "-"
              image = escape(str(artwork_url(row)))
              album_html = f'<div style="font-size:12px;color:#9aa3b2;margin-top:5px;line-height:1.35;">{album}</div>' if album else ""

              card_html.append(
                  '<td valign="top" width="33.333%" style="padding:6px;">'
                  '<div style="background:linear-gradient(180deg,#111a2b 0%,#0c1322 100%);border:1px solid #313a56;border-radius:16px;padding:11px;box-shadow:0 8px 22px rgba(2,6,23,0.38);text-align:center;">'
                  f'<img src="{image}" alt="{track}" width="108" height="108" style="display:block;width:108px;height:108px;margin:0 auto;border-radius:11px;object-fit:cover;border:1px solid #36415f;" />'
                  f'<div style="font-size:15px;line-height:1.28;font-weight:700;color:#f8fbff;margin-top:10px;word-break:break-word;letter-spacing:0.1px;">{track}</div>'
                  f'<div style="font-size:13px;line-height:1.35;color:#c5ccda;margin-top:4px;word-break:break-word;">{artist}</div>'
                  f'{album_html}'
                  f'<div style="font-size:12px;color:#8b5cf6;font-weight:700;margin-top:9px;letter-spacing:0.2px;">{time_text}</div>'
                  '</div>'
                  '</td>'
              )

          card_html.append('</tr>')
            card_html.append('</table>')
            card_html.append('')

          now_line = f'Now playing: <strong>{current_track}</strong> by {current_artist}' if current_track else 'Now playing: No active track'
          if current_time:
              now_line += f' • {current_time}'

          last_updated = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC")
            card_html.append('<div style="margin-top:8px;background:#0d1526;border:1px solid #2c3551;border-radius:14px;padding:10px 12px;">')
            card_html.append(f'<div style="font-size:13px;color:#c8d0e2;line-height:1.45;">{now_line}</div>')
            card_html.append(f'<div style="font-size:12px;color:#8b95ad;margin-top:4px;line-height:1.4;">Last updated: {last_updated}</div>')
            card_html.append('</div>')

          music_block = "\n".join(card_html) + "\n"
          with open("MUSIC.md", "w", encoding="utf-8") as f:
              f.write(music_block)

          with open("README.md", "r", encoding="utf-8") as f:
              readme = f.read()

          start = "<!-- MUSIC:START -->"
          end = "<!-- MUSIC:END -->"

          if start not in readme or end not in readme:
              raise SystemExit("README markers not found: MUSIC:START / MUSIC:END")

          before, rest = readme.split(start, 1)
          _, after = rest.split(end, 1)
          updated = before + start + "\n\n" + music_block + "\n" + end + after

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(updated)
          PY

      - name: Commit update
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"

          git add README.md MUSIC.md listening.json
          git diff --cached --quiet || git commit -m "chore: update listening data"
          git push
