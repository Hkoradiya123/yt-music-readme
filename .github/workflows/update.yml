name: Update README

on:
  workflow_dispatch:   # 👈 manual trigger
  schedule:
    - cron: "0 * * * *"  # optional (keep or remove)

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      - name: Install deps
        run: npm install

      - name: Run script
        run: node index.js

      - name: Commit changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add README.md
          git commit -m "Update README" || echo "No changes"
          git push
